plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.io.hookself.framework'
    ndkVersion '28.2.13676358'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        minSdk 24

        aarMetadata {
            minCompileSdk 24
        }

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments '-DHOOKSELF_BUILD_TEST_SUPPORT=ON'
                }
            }
        }
        release {
            externalNativeBuild {
                cmake {
                    arguments '-DHOOKSELF_BUILD_TEST_SUPPORT=OFF'
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        prefabPublishing true
    }

    prefab {
        hookself {
            headers 'src/main/cpp/hookself/include'
        }
    }
}
